name: pixgo
description: "Pixgo — Stream movies, series, anime and live TV."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # HTTP
  dio: ^5.4.3+1
  # Cookie jar persistente — necessário para o cookie pv_did (identidade de
  # dispositivo) e pixgo_session sobreviverem entre requests/reinícios da
  # app. Sem isto, cada request é tratado pelo backend como "dispositivo
  # novo" (ver middleware/rate-limit.js, resolveDeviceId), o que dispara o
  # cap de 5 dispositivos/IP/dia e nunca fecha corretamente o limite de
  # telas simultâneas do plano.
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1
  # ChaCha20 (RFC 8439) — só é necessário aqui: os segmentos de DOWNLOAD
  # OFFLINE (GET /content/:id/download) vêm cifrados, ao contrário do VOD
  # (WebView faz a decriptação real) e dos canais (sem DRM). Ver
  # services/chacha20_segment.dart.
  cryptography: ^2.7.0

  # Local storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  path: ^1.9.0

  # Video playback
  #  - Canais de TV ao vivo: HLS simples, sem encriptação → video_player/ExoPlayer nativo.
  #  - VOD (filmes/séries): abre uma WebView apontada para
  #    {WEB_BASE_URL}/embed/watch/:id — uma página mínima no frontend web
  #    que renderiza o componente ShakaPlayer.tsx REAL, sem alteração
  #    nenhuma. Corre no domínio de produção (já na allowlist de CORS da
  #    API), por isso o handshake ECDH e o heartbeat são feitos pelo
  #    próprio componente, exactamente como no site — nenhuma
  #    reimplementação em Dart. Ver watch_screen.dart.
  video_player: ^2.9.1
  chewie: ^1.8.3
  webview_flutter: ^4.7.0
  webview_flutter_android: ^3.16.0
  webview_flutter_wkwebview: ^3.13.0

  # UI
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  fluttertoast: ^8.2.5
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.0

  # i18n nativo do Flutter — necessário para MaterialLocalizations
  # (sem isto, TextField pode lançar "No MaterialLocalizations found"
  # e o Flutter desenha um bloco de erro cinzento em vez do widget real)
  flutter_localizations:
    sdk: flutter

  # Icons (Material — já nativo, mas garantindo o pacote completo)
  cupertino_icons: ^1.0.8

  # Utils
  intl: ^0.20.2
  crypto: ^3.0.3
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/i18n/
